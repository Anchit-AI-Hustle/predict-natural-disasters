<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Predict Natural Disasters</title><link rel="stylesheet" href="/portal.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"></head><body><div id="nav"></div><section class="hero"><h1 id="title">Live Disaster Intelligence</h1><p>Continuously refreshed from GDACS, USGS and NASA EONET.</p></section><main class="wrap"><div class="toolbar"><input class="input" id="q" placeholder="Search place or hazard"><button class="btn" id="refresh">Refresh</button><span id="status" class="statusbar">Loading…</span></div><section class="panel"><div class="ph"><h2>Live map</h2><a class="viewall" href="/events">View All Events →</a></div><div id="map" class="map"></div></section><section class="panel"><div class="ph"><h2 id="listTitle">Latest events</h2><a class="viewall" href="/events">View All →</a></div><div id="cards" class="event-grid"></div></section></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="/portal.js"></script><script>const mode=location.pathname.split('/').filter(Boolean)[0]||'live-map';const titles={"live-map":"Live Map","forecasts":"Forecasts","alerts":"Alerts","regions":"Regions"};title.textContent=titles[mode]||'Live Disaster Intelligence';nav.innerHTML=PND.nav(titles[mode]||'');const map=L.map('map').setView([20,10],2);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);const layer=L.layerGroup().addTo(map);let all=[];function ok(e){if(mode==='forecasts')return e.forecast||['Red','Orange'].includes(e.alert);if(mode==='alerts')return e.sourceType==='official'&&(['Red','Orange'].includes(e.alert)||e.source==='USGS');return true}function draw(){const s=q.value.toLowerCase();const es=all.filter(ok).filter(e=>!s||[e.title,e.country,e.region,e.type].join(' ').toLowerCase().includes(s));layer.clearLayers();es.slice(0,150).forEach(e=>L.circleMarker([e.lat,e.lon],{radius:e.alert==='Red'?9:e.alert==='Orange'?7:5,color:e.alert==='Red'?'#ef2639':e.alert==='Orange'?'#ff681e':'#25e29c',fillOpacity:.8}).addTo(layer).bindPopup(`<b>${PND.esc(e.title)}</b><br><a href="${PND.eventUrl(e)}">View details</a>`));cards.innerHTML=es.slice(0,24).map(e=>`<article class="event-card" onclick="location.href='${PND.eventUrl(e)}'"><span class="badge ${PND.riskClass(e.alert)}">${PND.esc(e.alert)}</span> ${PND.sourceBadge(e)}<h3>${PND.esc(e.title)}</h3><p>${PND.esc(e.type)} · ${PND.esc(e.country||e.region||'Global')}</p><small class="muted">${PND.fmtDate(e.updated)}</small></article>`).join('')}async function load(){try{const d=await PND.getEvents();all=d.events;status.textContent=`${PND.statusText(d.meta)} · ${PND.fmtDate(d.generatedAt)}`;draw()}catch(e){status.textContent='Feed unavailable — retrying'}}q.oninput=draw;refresh.onclick=load;load();setInterval(load,360000);</script></body></html>
