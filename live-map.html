<meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/portal.css"><link rel="stylesheet" href="/risk.css"><link rel="stylesheet" href="/vendor/leaflet/leaflet.css"></head><body><div id="nav"></div><section class="hero"><h1>Live disaster map</h1><p>Events reported by official agencies, shown on a map. This page refreshes every minute.</p></section><main class="wrap"><div class="toolbar"><input class="input" id="q" aria-label="Search place or hazard" placeholder="Search place or hazard"><select id="sortBy" aria-label="Sort results" class="select"></select><button class="btn" id="refresh">↻ Refresh now</button><span id="statusLine" class="statusbar">Loading…</span></div><section class="panel"><div class="ph"><h2>Live map</h2><a class="viewall" href="/events">See all events →</a></div><div id="map" class="map"></div></section><section class="panel"><div class="ph"><h2>Latest events</h2><a class="viewall" href="/recent-events">See all →</a></div><div id="cards" class="event-grid"></div></section></main><script src="/vendor/leaflet/leaflet.js"></script><script src="/globe.js"></script><script src="/map-setup.js"></script><script src="/search.js"></script><script src="/hazard-model.js"></script><script src="/risk.js"></script><script src="/portal.js"></script><script>nav.innerHTML=PND.nav('Live Map');const map=L.map('map',{worldCopyJump:true});PNDMap.basemap(map);const layer=L.layerGroup().addTo(map);let all=[];function draw(){const s=q.value.toLowerCase();let es=all.filter(e=>!s||PND.matches(e,s));es=PND.sortBy('sortBy',es);layer.clearLayers();es.slice(0,220).forEach(e=>PNDMap.riskMarker([e.lat,e.lon],e.alert,e.title).addTo(layer).bindPopup(`<b>${PND.esc(e.title)}</b><br>${PND.esc(e.type)} · ${PND.esc(e.source)}<br><a href="${PND.eventUrl(e)}">See details</a>`));cards.innerHTML=es.slice(0,30).map(e=>`<a class="event-card" href="${PND.eventUrl(e)}">${PND.riskTag(e)} ${PND.sourceBadge(e)}<h3>${PND.esc(e.title)}</h3><p>${PND.esc(e.type)} · ${PND.esc(PND.placeOf(e,'Place not given'))}<br>${PND.esc(PND.summary(PND.impactText(e)||e.details||''))}</p><small class="muted">Source updated ${PND.fmtDate(e.updated)} · ${PND.age(e.updated)}</small></a>`).join('')}async function load(){statusLine.textContent='Loading the latest data…';try{const d=await PND.getEvents();all=d.events;statusLine.textContent=`${PND.statusText(d.meta)} · updated ${PND.age(d.generatedAt)}`;draw()}catch(e){statusLine.textContent='Live data unavailable. Trying again automatically.'}}PND.initSort('sortBy',PND.EVENT_SORTS,draw);PNDSearch.initSearch(q,draw);refresh.onclick=load;PND.autoRefresh(load,60000);</script><script src="/glossary.js"></script></body></html>
