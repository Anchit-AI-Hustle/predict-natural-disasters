<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Map · Predict Natural Disasters</title><link rel="stylesheet" href="/portal.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"></head><body><div id="nav"></div><section class="hero"><h1>Live Disaster Intelligence</h1><p>Continuously refreshed from GDACS, USGS and NASA EONET.</p></section><main class="wrap"><div class="toolbar"><input class="input" id="q" placeholder="Search place or hazard"><select id="sortBy" class="select"></select><button class="btn" id="refresh">↻ Refresh now</button><span id="statusLine" class="statusbar">Loading…</span></div><section class="panel"><div class="ph"><h2>Live map</h2><a class="viewall" href="/events">View All Events →</a></div><div id="map" class="map"></div></section><section class="panel"><div class="ph"><h2>Latest events</h2><a class="viewall" href="/recent-events">View All →</a></div><div id="cards" class="event-grid"></div></section></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="/portal.js"></script><script>nav.innerHTML=PND.nav('Live Map');const map=L.map('map',{worldCopyJump:true}).setView([20,10],2);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(map);const layer=L.layerGroup().addTo(map);let all=[];function draw(){const s=q.value.toLowerCase();const es=all.filter(e=>!s||[e.title,e.country,e.region,e.type,e.source].join(' ').toLowerCase().includes(s));es=PND.sortBy('sortBy',es);layer.clearLayers();es.slice(0,220).forEach(e=>L.circleMarker([e.lat,e.lon],{radius:e.alert==='Red'?9:e.alert==='Orange'?7:5,color:e.alert==='Red'?'#ef2639':e.alert==='Orange'?'#ff681e':'#25e29c',fillOpacity:.8}).addTo(layer).bindPopup(`<b>${PND.esc(e.title)}</b><br>${PND.esc(e.type)} · ${PND.esc(e.source)}<br><a href="${PND.eventUrl(e)}">View details</a>`));cards.innerHTML=es.slice(0,30).map(e=>`<a class="event-card" href="${PND.eventUrl(e)}"><span class="badge ${PND.riskClass(e.alert)}">${PND.esc(e.alert||'Live')}</span> ${PND.sourceBadge(e)}<h3>${PND.esc(e.title)}</h3><p>${PND.esc(e.type)} · ${PND.esc(e.country||e.region||'Global')}<br>${PND.esc(PND.impactText(e)||e.details||'')}</p><small class="muted">Source update ${PND.fmtDate(e.updated)} · ${PND.age(e.updated)}</small></a>`).join('')}async function load(){statusLine.textContent='Refreshing authoritative feeds…';try{const d=await PND.getEvents();all=d.events;statusLine.textContent=`${PND.statusText(d.meta)} · fetched ${PND.age(d.generatedAt)}`;draw()}catch(e){statusLine.textContent='Feed unavailable · retrying automatically'}}PND.initSort('sortBy',PND.EVENT_SORTS,draw);q.oninput=draw;refresh.onclick=load;PND.autoRefresh(load,60000);</script></body></html>
