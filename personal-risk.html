<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Personal Risk Centre | Predict Natural Disasters</title><link rel="stylesheet" href="/portal.css"></head><body><div id="nav"></div><main class="wrap"><section class="hero"><h1>Personal Risk Centre</h1><p>Track places that matter to you. Location data stays in this browser.</p></section><section class="panel"><div class="ph"><h3>Saved locations</h3><button class="btn" onclick="PND.replayTour()">Replay tour</button></div><form id="f" class="toolbar"><select id="kind" class="select"><option>Home</option><option>Office</option><option>Family</option><option>Travel</option></select><input id="name" class="input" required placeholder="Place name"><input id="lat" class="input" required type="number" step="any" min="-90" max="90" placeholder="Latitude"><input id="lon" class="input" required type="number" step="any" min="-180" max="180" placeholder="Longitude"><button class="btn">Save</button></form><p class="muted">Manual coordinates are supported so precise device location is never required.</p><div id="saved"></div></section><section class="panel" style="margin-top:10px"><div class="ph"><h3>Risks relevant to your places</h3><span id="fresh" class="muted">Loading…</span></div><div id="risks"></div></section></main><script src="/hazard-model.js"></script><script src="/portal.js"></script><script>nav.innerHTML=PND.nav('Personal Risk');let events=[];function draw(){const a=PND.savedLocations();saved.innerHTML=a.length?a.map(x=>`<div class="card"><b>${PND.esc(x.kind)} · ${PND.esc(x.name)}</b><div class="muted">${x.lat}, ${x.lon}</div><button class="btn" onclick="PND.removeLocation('${x.id}');draw()">Remove</button></div>`).join(''):'<div class="empty">No saved locations yet.</div>';const rows=[];a.forEach(x=>events.forEach(e=>{if(Number.isFinite(+e.lat)&&Number.isFinite(+e.lon)){const d=PND.distanceKm(+x.lat,+x.lon,+e.lat,+e.lon);if(d<=500)rows.push({x,e,d})}}));rows.sort((a,b)=>a.d-b.d);risks.innerHTML=rows.length?rows.slice(0,30).map(r=>`<a class="card" style="display:block;text-decoration:none;color:inherit" href="${PND.eventUrl(r.e)}"><span class="provenance">${PND.provenance(r.e)}</span><b style="display:block;margin-top:7px">${PND.esc(r.e.title)}</b><div class="muted">${Math.round(r.d)} km from ${PND.esc(r.x.name)} · ${PND.esc(r.e.type)}</div></a>`).join(''):'<div class="empty">No current feed events within 500 km of your saved places.</div>'}f.onsubmit=e=>{e.preventDefault();PND.saveLocation({kind:kind.value,name:name.value,lat:+lat.value,lon:+lon.value});f.reset();draw()};PND.getEvents().then(d=>{events=d.events||[];fresh.textContent='Updated '+PND.age(d.meta&&d.meta.generatedAt);draw()}).catch(()=>{fresh.textContent='Live feed unavailable';risks.innerHTML='<div class="stale">Live data could not be refreshed. Do not rely on this page for emergency decisions; check local authorities.</div>'});draw();setTimeout(()=>PND.startTour(),500);</script></body></html>
