<meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/portal.css"><link rel="stylesheet" href="/risk.css"></head><body><div id="nav"></div><section class="hero"><h1 id="pageTitle">Live Global Events</h1><p id="pageSub">Continuously refreshed disaster intelligence from authoritative global feeds.</p></section><main class="wrap"><div class="toolbar"><input id="q" aria-label="Search country, city, hazard or source" class="input" placeholder="Search country, city, hazard or source"><select id="type" aria-label="Filter by hazard type" class="select"><option value="">All hazards</option><option>Flood</option><option>Earthquake</option><option>Wildfires</option><option>Volcanoes</option><option>Severe Storms</option><option>Drought</option></select><select id="level" aria-label="Filter by alert level" class="select"><option value="">All risk levels</option><option>Red</option><option>Orange</option><option>Green</option></select><select id="sortBy" aria-label="Sort results" class="select"></select><button id="refresh" class="btn">↻ Refresh live data</button></div><section class="panel"><div class="ph"><h2 id="heading">All events</h2><div class="statusbar"><span id="statusLine">Loading…</span></div></div><div id="cards" class="event-grid"></div></section><div class="notice">Live results are fetched from GDACS, USGS and NASA EONET. If an upstream service is unavailable, any fallback item is explicitly labelled as cached rather than presented as live.</div></main><script src="/search.js"></script><script src="/hazard-model.js"></script><script src="/risk.js"></script><script src="/portal.js"></script><script>nav.innerHTML=PND.nav('');let all=[];const path=location.pathname;const mode=path.split('/').filter(Boolean)[0]||'events';const cfg={events:['Live Global Events','Current and recent multi-hazard events from authoritative feeds.'], 'recent-events':['Recent Major Events','Latest observed disasters and significant hazard activity.'], 'official-warnings':['Official Warnings & Alerts','Higher-priority GDACS alerts and agency-observed events.'], 'hazard-types':['Hazards by Type','Browse live events by flood, earthquake, wildfire, volcano, storm and drought.'], 'forecast-list':['High-Risk Forecasts','Forecast signals and monitored high-risk windows.'], 'forecast-calendar':['Forecast Calendar','Upcoming monitored forecast windows and live hazard context.'], 'historical-events':['Historical & Recent Event Explorer','Browse recent GDACS-backed event history and current feeds.'], 'alerts-notifications':['Current Alerts','Review current higher-priority alerts and official warnings.'], resources:['Learn & Resources','Authoritative source links, methodology and safety guidance.'], 'compare-locations':['Compare Locations','Compare live hazard signals across locations using search filters.']}[mode]||['Disaster Intelligence','Live disaster intelligence'];pageTitle.textContent=cfg[0];pageSub.textContent=cfg[1];heading.textContent=cfg[0];if(mode==='forecast-list'||mode==='forecast-calendar')type.value='';function keep(e){if(mode==='official-warnings'&&!(['Red','Orange'].includes(e.alert)||e.source==='USGS'))return false;if(mode==='forecast-list'||mode==='forecast-calendar')return e.forecast===true||['Red','Orange'].includes(e.alert);if(mode==='historical-events')return true;if(mode==='resources')return false;return true}function draw(){let s=q.value.toLowerCase(),t=type.value.toLowerCase(),l=level.value;let es=PND.sortBy('sortBy',all.filter(keep).filter(e=>(!s||PND.matches(e,s))&&(!t||String(e.type).toLowerCase().includes(t.replace('s','')))&&(!l||e.alert===l)));if(mode==='resources'){cards.innerHTML=[['GDACS','Global Disaster Awareness and Coordination System','https://www.gdacs.org/'],['USGS','Earthquake Hazards Program','https://earthquake.usgs.gov/'],['NASA EONET','Earth Observatory Natural Event Tracker','https://eonet.gsfc.nasa.gov/'],['WMO','World Meteorological Organization','https://wmo.int/']].map(([a,b,u])=>`<div class="event-card" onclick="location.href='${u}'"><span class="source">Authoritative source</span><h3>${a}</h3><p>${b}</p></div>`).join('');return}cards.innerHTML=es.length?es.map(e=>`<article class="event-card" onclick="location.href='${PND.eventUrl(e)}'"><span class="badge ${PND.riskClass(e.alert)}">${PND.esc(e.alert||'Live')}</span> ${PND.sourceBadge(e)}<h3>${PND.esc(e.title)}</h3><p>${PND.esc(e.type)} · ${PND.esc(e.country||e.region||'Global')}<br>${PND.esc(e.details||'')}</p><small class="muted">Updated ${PND.fmtDate(e.updated)}</small></article>`).join(''):PND.emptyHtml(q.value,all,all,'live events')}async function load(){statusLine.textContent='Refreshing…';try{const d=await PND.getEvents();all=d.events;statusLine.textContent=`${PND.statusText(d.meta)} · ${all.length} events · ${PND.fmtDate(d.generatedAt)}`;draw()}catch(e){statusLine.textContent='Feed unavailable — retrying';}}PND.initSort('sortBy',PND.EVENT_SORTS,draw);PNDSearch.initSearch(q,draw);type.onchange=draw;level.onchange=draw;refresh.onclick=load;load();setInterval(load,360000);</script><script src="/glossary.js"></script></body></html>
