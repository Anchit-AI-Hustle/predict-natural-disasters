<meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/portal.css"><link rel="stylesheet" href="/risk.css"><script src="/trust.js" data-trust="feed models"></script></head><body><div id="nav"></div><section class="hero"><h1 id="pageTitle">Event directory</h1><p id="pageSub">Search current events reported by official agencies.</p></section><main class="wrap"><div class="toolbar"><input id="q" aria-label="Search country, city, hazard or source" class="input" placeholder="Search country, city, hazard or source"><select id="type" aria-label="Filter by hazard type" class="select"><option value="">All hazards</option><option>Flood</option><option>Earthquake</option><option>Wildfires</option><option>Volcanoes</option><option>Severe Storms</option><option>Drought</option></select><select id="level" aria-label="Filter by risk level" class="select"><option value="">All risk levels</option><!--risk-levels--></select><select id="sortBy" aria-label="Sort results" class="select"></select><button id="refresh" class="btn">↻ Refresh now</button></div><section class="panel"><div class="ph"><h2 id="heading">All events</h2><div class="statusbar"><span id="statusLine">Loading…</span></div></div><div id="cards" class="event-grid"></div></section><div class="notice">We get these events from official sources such as GDACS, USGS and NASA EONET. If a source is down, any saved copy of an event we show is labelled as saved, not live.</div></main><script src="/search.js"></script><script src="/hazard-model.js"></script><script src="/risk.js"></script><script src="/portal.js"></script><script>nav.innerHTML=PND.nav('');let all=[];const path=location.pathname;const mode=path.split('/').filter(Boolean)[0]||'events';const cfg={events:['Events happening now','Disasters reported by official agencies, and our own forecasts of what may happen next.'], 'recent-events':['Recent events','The latest disasters and other significant events.'], 'official-warnings':['Official warnings','The most serious alerts, plus earthquakes reported by the USGS.'], 'hazard-types':['Events by type','Browse current events by type: flood, earthquake, wildfire, volcano, storm and drought.'], 'forecast-list':['Forecasts and serious events','Our own forecasts, plus current events with a red or orange alert.'], 'forecast-calendar':['Forecast calendar','Our own forecasts, plus current events with a red or orange alert.'], 'historical-events':['Past and recent events','Recent past events from GDACS, plus the events happening now.'], 'alerts-notifications':['Current alerts','The most serious current alerts and official warnings.'], resources:['Sources','Links to official sources.'], 'compare-locations':['Compare places','Search for a place to see its current events. Then search for another place to compare.']}[mode]||['Event directory','Search current events reported by official agencies.'];pageTitle.textContent=cfg[0];pageSub.textContent=cfg[1];heading.textContent=cfg[0];if(mode==='forecast-list'||mode==='forecast-calendar')type.value='';function keep(e){if(mode==='official-warnings'&&!(['Red','Orange'].includes(e.alert)||e.source==='USGS'))return false;if(mode==='forecast-list'||mode==='forecast-calendar')return e.forecast===true||['Red','Orange'].includes(e.alert);if(mode==='historical-events')return true;if(mode==='resources')return false;return true}function draw(){let s=q.value.toLowerCase(),t=type.value.toLowerCase(),l=level.value;let es=PND.sortBy('sortBy',all.filter(keep).filter(e=>(!s||PND.matches(e,s))&&(!t||String(e.type).toLowerCase().includes(t.replace('s','')))&&PND.matchesRiskLevel(e,l)));if(mode==='resources'){cards.innerHTML=[['GDACS','Global Disaster Alert and Coordination System','https://www.gdacs.org/'],['USGS','Earthquake Hazards Program','https://earthquake.usgs.gov/'],['NASA EONET','Earth Observatory Natural Event Tracker','https://eonet.gsfc.nasa.gov/'],['WMO','World Meteorological Organization','https://wmo.int/']].map(([a,b,u])=>`<div class="event-card" onclick="location.href='${u}'"><span class="prov">Official source</span><h3>${a}</h3><p>${b}</p></div>`).join('');return}cards.innerHTML=es.length?es.map(e=>`<article class="event-card" onclick="location.href='${PND.eventUrl(e)}'">${PND.riskTag(e)} ${PND.sourceBadge(e)}<h3>${PND.esc(e.title)}</h3><p>${PND.esc(e.type)} · ${PND.esc(PND.placeOf(e,'Place not given'))}<br>${PND.esc(e.details||'')}</p><small class="muted">Updated ${PND.fmtDate(e.updated)}</small></article>`).join(''):PND.emptyHtml(q.value,all,all,'events')}async function load(){statusLine.textContent='Loading the latest data…';try{const d=await PND.getEvents();all=d.events;statusLine.textContent=`${PND.statusText(d.meta)} · ${all.length} events · ${PND.fmtDate(d.generatedAt)}`;draw()}catch(e){statusLine.textContent='Live data unavailable. Trying again automatically.';}}PND.initSort('sortBy',PND.EVENT_SORTS,draw);PNDSearch.initSearch(q,draw);type.onchange=draw;level.onchange=draw;refresh.onclick=load;load();setInterval(load,360000);</script><script src="/glossary.js"></script></body></html>
