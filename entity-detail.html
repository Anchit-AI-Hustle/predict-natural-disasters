<meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/portal.css"><link rel="stylesheet" href="/risk.css"><style>.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{padding:11px}.stat strong{display:block;font-size:18px}.cols{display:grid;grid-template-columns:1.1fr .9fr;gap:10px}.list{display:grid;gap:8px;padding:10px}.item{border:1px solid #1d654c;border-radius:8px;padding:10px;background:#08251c}.actions{display:flex;gap:8px;flex-wrap:wrap}.action{display:inline-block;color:#e8f7f0;text-decoration:none;border:1px solid #26624d;border-radius:8px;padding:8px 10px;background:#09271e}@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}}</style><script src="/trust.js"></script></head><body><div id="nav"></div><section class="hero"><div class="muted" id="eyebrow">DETAILS</div><h1 id="title">Details</h1><p id="subtitle">More about this topic.</p><div class="stats" style="margin-top:12px"><div class="card stat"><span class="muted">TYPE</span><strong id="kType">-</strong></div><div class="card stat"><span class="muted">STATUS</span><strong id="kStatus">-</strong></div><div class="card stat"><span class="muted">COVERS</span><strong id="kScope">-</strong></div><div class="card stat"><span class="muted">UPDATED</span><strong id="kUpdated">-</strong></div></div></section><main class="wrap"><div class="cols"><section><div class="panel"><div class="ph"><h2 id="mainHead">Details</h2><span id="fresh" class="statusbar">Current</span></div><div class="detail" id="main"></div></div><section class="panel" style="margin-top:10px"><div class="ph"><h2>Related pages</h2><select id="sortBy" aria-label="Sort results" class="select" style="font-size:11px;padding:5px 7px"></select></div><div class="list" id="related"></div></section></section><aside><section class="panel"><div class="ph"><h2>Go to</h2></div><div class="detail actions" id="actions"></div></section><section class="panel" style="margin-top:10px"><div class="ph"><h2>About this page</h2></div><div class="detail" id="notes"></div></section></aside></div></main><script src="/hazard-model.js"></script><script src="/risk.js"></script><script src="/portal.js"></script><script>nav.innerHTML=PND.nav('');const q=PND.qs.bind(PND),kind=(q('kind')||location.pathname.split('/').filter(Boolean)[0].replace('-detail','')||'detail').toLowerCase(),id=q('id')||q('topic')||q('section')||q('metric')||q('name')||'overview';const catalog={insight:{'flood-landslide':{title:'Floods and landslides: how they are linked',scope:'Linked hazards',body:'Heavy or long rain can set off a chain of problems. Drains overflow, rivers rise and hillsides get soaked, which can cause landslides. Roads and other services can then fail. We track each step on its own, so heavy rain alone is not counted as damage.',links:[['Floods','/hazard-detail?type=Flood'],['Landslides','/hazard-detail?type=Landslide'],['Current disasters','/calamities']]},'geographic-clustering':{title:'Events near a place come first',scope:'Place',body:'What matters depends on where you are. We show events at or near a place first, and events elsewhere in the world below them.',links:[['Regions','/regions'],['The whole world','/region-detail?region=World']]},'forecast-discipline':{title:'How we keep forecasts honest',scope:'Checking forecasts',body:'We lock each forecast before we know what happens. Later we check it against clear rules for timing, place, cause and impact. A warning or heavy rain alone does not make a forecast correct. The locked rules must be met.',links:[['How we check forecasts','/verification'],['Test case ND-001','/verification-detail?id=ND-001']]},'extreme-rainfall-central-vietnam':{title:'Very heavy rain in one area',scope:'Central Vietnam',body:'This note follows very heavy rain in Central Vietnam, and the floods and landslides it may cause.',links:[['Vietnam','/region-detail?region=Vietnam'],['Test forecast ND-001','/forecast-detail?id=ND-001']]},'monsoon-northern-india':{title:'Monsoon rivers',scope:'Northern India',body:'Local flooding depends on river levels, how well drains cope, how much rain has already fallen and the land around each river. These matter more than any worldwide ranking.',links:[['India','/region-detail?region=India'],['Floods','/hazard-detail?type=Flood']]},'wildfire-western-north-america':{title:'Why wildfires keep burning',scope:'Western North America',body:'How long a wildfire lasts depends on how dry it is, the wind, what there is to burn, what started it and how firefighters tackle it. For fires seen by satellite, we show when the source last updated.',links:[['Wildfires','/hazard-detail?type=Wildfires']]},'seismic-pacific-rim':{title:'Earthquakes',scope:'Pacific Rim',body:'Earthquakes that have happened can be followed almost as they happen. Science cannot yet predict the exact date, time and place of a future earthquake.',links:[['Earthquakes','/hazard-detail?type=Earthquake'],['USGS','/source-detail?source=USGS']]}},methodology:{'collect':{title:'Collect',scope:'Step 1',body:'We collect reports of events and warnings from official science and disaster agencies. We keep the name of each source and the time it gave.',links:[['Sources','/resources'],['GDACS','/source-detail?source=GDACS'],['USGS','/source-detail?source=USGS']]},'normalize':{title:'Tidy',scope:'Step 2',body:'We put every report into the same format: type of hazard, source, time, map position, place, severity, impact, status and how up to date it is.',links:[['Events','/events']]},'rank':{title:'Sort',scope:'Step 3',body:'We sort events by how serious and urgent they are, how reliable the source is, how recent the report is and how close they are. Nearby events count most, so events far away do not crowd out a local page.',links:[['Regions','/regions'],['Methodology','/methodology']]},'forecast':{title:'Forecast',scope:'Step 4',body:'We publish forecasts of what may happen next. Each one names a place, a forecast period, the cause, how uncertain it is and how we will check it later.',links:[['Forecasts','/forecasts']]},'freeze':{title:'Lock',scope:'Step 5',body:'We lock each forecast before we know what happens. That way its dates, place and rules for success cannot be widened afterwards.',links:[['How we check forecasts','/verification']]},'verify':{title:'Check',scope:'Step 6',body:'We compare what actually happened with the locked forecast. We mark it correct, partly correct or wrong only after the forecast period ends, or once there is enough evidence.',links:[['How we check forecasts','/verification'],['Test case ND-001','/verification-detail?id=ND-001']]},'priority-model':{title:'How we rank events',scope:'Ranking',body:'Our ranking combines how serious and urgent an event is, how reliable the source is, how recent it is and how close it is. It is only a way to sort events. It is not the chance that something will happen, unless we say so.',links:[['Methodology','/methodology']]},'probability-policy':{title:'Why we do not give percentages',scope:'How we describe risk',body:'We do not make up percentages. We describe risk in levels, such as high or low, unless a tested and reliable probability supports a number.',links:[['Methodology','/methodology']]},'source-classes':{title:'Types of source',scope:'Where data comes from',body:'Reports of events that have happened, and official warnings, are our main evidence. Forecasts look ahead, and we check them separately. Past disasters give background only.',links:[['Sources','/resources']]}},metric:{'visible-events':{title:'Events shown',scope:'World overview',body:'The number of current events shown, after we collect them, remove duplicates and apply the page’s filters.',links:[['All events','/events']]},'official-sources':{title:'Official sources',scope:'Sources',body:'How many official sources we read for current events, and whether each one is working.',links:[['Sources','/resources']]},'high-risk-events':{title:'High-risk events',scope:'Most serious events',body:'Current events with a high alert or severity level, or a high-risk forecast.',links:[['Official warnings','/official-warnings'],['Forecasts','/forecast-list']]},'live-feeds':{title:'Source status',scope:'Data',body:'Shows which sources answered the last time we checked. If a source fails, we say so and do not treat it as live.',links:[['Sources','/resources']]}},resource:{'gdacs':{title:'GDACS',scope:'Global disaster alerts',body:'We use GDACS to find events of every type, with their alert levels and likely impact.',links:[['About GDACS','/source-detail?source=GDACS']]},'usgs':{title:'USGS',scope:'Earthquakes',body:'The USGS Earthquake Hazards Program. We use it for each earthquake’s magnitude, depth, place and time.',links:[['About USGS','/source-detail?source=USGS']]},'eonet':{title:'NASA EONET',scope:'Seen from space',body:'NASA’s tracker of natural events seen from space. We use it to follow events that are still going on, with links to the source.',links:[['About NASA EONET','/source-detail?source=NASA%20EONET']]},'wmo':{title:'WMO',scope:'Weather and climate background',body:'The World Meteorological Organization. A reference for background on weather and climate. This site does not read its data.',links:[['About the WMO','/source-detail?source=WMO']]}},about:{'mission':{title:'Our aim',scope:'About this site',body:'To give clear, open information on natural disasters worldwide. We keep five things apart: events that have happened, official warnings, our forecasts, past disasters, and how our forecasts turned out.',links:[['About','/about']]},'coverage':{title:'What we cover',scope:'Worldwide',body:'We cover whatever the official sources we read report, anywhere in the world. If we show nothing for a place, our sources have no report for it. It does not mean there is no risk.',links:[['Regions','/regions'],['Current disasters','/calamities']]},'limitations':{title:'Limits',scope:'Safety',body:'We cannot promise to report every hazard everywhere, or to report it the moment it happens. We do not replace official local emergency instructions.',links:[['Methodology','/methodology']]}}};

const KIND_LABEL={insight:'Insight',methodology:'How it works',metric:'Figure',resource:'Source',about:'About'};const kindLabel=KIND_LABEL[kind]||kind;eyebrow.textContent=kindLabel.toUpperCase();title.textContent=d.title;subtitle.textContent=d.scope;kType.textContent=kindLabel;kStatus.textContent='Available';kScope.textContent=d.scope;kUpdated.textContent='Current';mainHead.textContent=d.title;main.innerHTML=`<h3>Overview</h3><p>${PND.esc(d.body)}</p><h3>Where to go next</h3><p>The links on this page lead to live events, places, hazards, sources and forecasts related to this topic.</p>`;const ENTITY_KEYS=['curated','name'];const drawLinks=()=>{const key=PND.sortValue('sortBy',ENTITY_KEYS);const links=(d.links||[]).slice();if(key==='name')links.sort((a,b)=>String(a[0]).localeCompare(String(b[0])));related.innerHTML=links.map(([n,u])=>`<a class="item" href="${u}"><b>${PND.esc(n)}</b><div class="muted">Open this page →</div></a>`).join('')};PND.SORT_DEFS.curated={label:'Suggested order',cmp:()=>0};drawLinks();PND.initSort('sortBy',ENTITY_KEYS,drawLinks);actions.innerHTML=`<a class="action" href="/">Home</a><a class="action" href="/calamities">Current disasters</a><a class="action" href="/live-map">Live map</a><a class="action" href="/resources">Sources</a>`;notes.innerHTML=`<p><b>Topic type:</b> ${PND.esc(kindLabel)}</p><p><b>Topic ID:</b> ${PND.esc(id)}</p><p class="muted">For live data, with the time each source gave, open the linked event, source or region pages.</p>`;</script><script src="/glossary.js"></script></body></html>
