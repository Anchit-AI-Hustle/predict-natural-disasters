<meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/portal.css"><link rel="stylesheet" href="/risk.css"><style>.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{padding:11px}.stat strong{display:block;font-size:18px}.cols{display:grid;grid-template-columns:1.1fr .9fr;gap:10px}.list{display:grid;gap:8px;padding:10px}.item{border:1px solid #1d654c;border-radius:8px;padding:10px;background:#08251c}.actions{display:flex;gap:8px;flex-wrap:wrap}.action{display:inline-block;color:#e8f7f0;text-decoration:none;border:1px solid #26624d;border-radius:8px;padding:8px 10px;background:#09271e}@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}}</style></head><body><div id="nav"></div><section class="hero"><div class="muted" id="eyebrow">DETAIL PAGE</div><h1 id="title">Detail</h1><p id="subtitle">Full context for the selected item.</p><div class="stats" style="margin-top:12px"><div class="card stat"><span class="muted">TYPE</span><strong id="kType">—</strong></div><div class="card stat"><span class="muted">STATUS</span><strong id="kStatus">—</strong></div><div class="card stat"><span class="muted">SCOPE</span><strong id="kScope">—</strong></div><div class="card stat"><span class="muted">UPDATED</span><strong id="kUpdated">—</strong></div></div></section><main class="wrap"><div class="cols"><section><div class="panel"><div class="ph"><h2 id="mainHead">Full detail</h2><span id="fresh" class="statusbar">Current context</span></div><div class="detail" id="main"></div></div><section class="panel" style="margin-top:10px"><div class="ph"><h2>Connected detail pages</h2><select id="sortBy" aria-label="Sort results" class="select" style="font-size:11px;padding:5px 7px"></select></div><div class="list" id="related"></div></section></section><aside><section class="panel"><div class="ph"><h2>Actions</h2></div><div class="detail actions" id="actions"></div></section><section class="panel" style="margin-top:10px"><div class="ph"><h2>Interpretation & provenance</h2></div><div class="detail" id="notes"></div></section></aside></div></main><script src="/hazard-model.js"></script><script src="/risk.js"></script><script src="/portal.js"></script><script>nav.innerHTML=PND.nav('');const q=PND.qs.bind(PND),kind=(q('kind')||location.pathname.split('/').filter(Boolean)[0].replace('-detail','')||'detail').toLowerCase(),id=q('id')||q('topic')||q('section')||q('metric')||q('name')||'overview';const catalog={insight:{'flood-landslide':{title:'Flood & landslide coupling',scope:'Compound hazards',body:'Intense or sustained rainfall can create linked impacts: drainage overload, river rise, slope saturation, landslides, transport disruption and infrastructure failure. Each stage is tracked separately so a rainfall signal is not automatically counted as an impact.',links:[['Flood hazard','/hazard-detail?type=Flood'],['Landslide hazard','/hazard-detail?type=Landslide'],['Current calamities','/calamities']]},'geographic-clustering':{title:'Geographic clustering',scope:'Geographic relevance',body:'Hazard relevance is location-dependent. The system prioritizes exact and nearby geography over unrelated global events, while still retaining global context below local results.',links:[['Regions','/regions'],['World region detail','/region-detail?region=World']]},'forecast-discipline':{title:'Forecast discipline',scope:'Verification',body:'Forecasts are frozen before outcomes and later graded against explicit timing, geography, mechanism and impact criteria. Warnings or rainfall alone do not count as a success unless the frozen outcome criteria are met.',links:[['Verification','/verification'],['ND-001 detail','/verification-detail?id=ND-001']]},'extreme-rainfall-central-vietnam':{title:'Extreme rainfall concentration',scope:'Central Vietnam',body:'This analytical note tracks concentration of extreme rainfall and the associated flood and slope-failure monitoring priority in Central Vietnam.',links:[['Vietnam region','/region-detail?region=Vietnam'],['ND-001 forecast','/forecast-detail?id=ND-001']]},'monsoon-northern-india':{title:'Monsoon river exposure',scope:'Northern India',body:'River levels, drainage capacity, antecedent rainfall and local catchment conditions determine local flood impact more than broad global ranking.',links:[['India region','/region-detail?region=India'],['Flood hazard','/hazard-detail?type=Flood']]},'wildfire-western-north-america':{title:'Wildfire persistence',scope:'Western North America',body:'Wildfire persistence depends on dryness, wind, fuel state, ignition and suppression conditions. Satellite-observed open events are contextualized with source freshness.',links:[['Wildfire hazard','/hazard-detail?type=Wildfires']]},'seismic-pacific-rim':{title:'Seismic activity',scope:'Pacific Rim',body:'Observed earthquakes can be monitored in near-real time. Exact future earthquake date, time and location prediction is not treated as scientifically established.',links:[['Earthquake hazard','/hazard-detail?type=Earthquake'],['USGS source','/source-detail?source=USGS']]}} ,methodology:{collect:{title:'Collect',scope:'Pipeline step 1',body:'Ingest authoritative observations, event feeds and warnings from connected scientific and disaster-management sources. Preserve source identity and source timestamp.',links:[['Sources','/resources'],['GDACS','/source-detail?source=GDACS'],['USGS','/source-detail?source=USGS']]},normalize:{title:'Normalize',scope:'Pipeline step 2',body:'Map raw records into a shared event schema: hazard type, source, time, coordinates, geography, severity, impact metrics, status and freshness.',links:[['Events','/events']]},rank:{title:'Rank',scope:'Pipeline step 3',body:'Rank using severity, urgency, source confidence, freshness, exposure and geographic relevance. Local relevance is weighted strongly so unrelated global events do not dominate local pages.',links:[['Regions','/regions'],['Methodology','/methodology']]},forecast:{title:'Forecast',scope:'Pipeline step 4',body:'Publish bounded forward-looking outlooks with geography, target window, mechanism, uncertainty and later verification criteria.',links:[['Forecasts','/forecasts']]},freeze:{title:'Freeze',scope:'Pipeline step 5',body:'Lock the prediction record before the outcome so date, location and success criteria cannot be broadened after the fact.',links:[['Verification','/verification']]},verify:{title:'Verify',scope:'Pipeline step 6',body:'Compare actual evidence to the frozen record and assign HIT, PARTIAL HIT or MISS only after the target window closes or sufficient evidence exists.',links:[['Verification','/verification'],['ND-001','/verification-detail?id=ND-001']]},'priority-model':{title:'Priority model',scope:'Ranking model',body:'Priority combines severity, urgency, confidence, freshness, exposure and geographic relevance. It is a ranking index, not a calibrated event probability unless explicitly stated.',links:[['Methodology','/methodology']]},'probability-policy':{title:'Probability policy',scope:'Risk communication',body:'The app avoids fabricated percentages. Categorical risk or a risk index is used unless a validated calibrated probability supports a numeric probability.',links:[['Methodology','/methodology']]},'source-classes':{title:'Source classes',scope:'Data provenance',body:'Observed events and official warnings are primary evidence. Forecasts are forward-looking and verified separately. Historical records are contextual.',links:[['Sources','/resources']]}} ,metric:{'visible-events':{title:'Visible events',scope:'Global dashboard',body:'Count of current records visible after source ingestion, deduplication and app-level filtering.',links:[['All events','/events']]},'official-sources':{title:'Official sources',scope:'Source coverage',body:'Count and health of connected authoritative source feeds used for current observations.',links:[['Sources','/resources']]},'high-risk-events':{title:'High-risk events',scope:'Priority events',body:'Current records carrying higher alert/severity classifications or forecast priority.',links:[['Official warnings','/official-warnings'],['Forecasts','/forecast-list']]},'live-feeds':{title:'Live feed health',scope:'Data pipeline',body:'Shows which upstream feeds responded successfully on the latest fetch cycle. A failed source is not silently treated as live.',links:[['Sources','/resources']]}} ,resource:{gdacs:{title:'GDACS resource',scope:'Global disaster feed',body:'Global Disaster Awareness and Coordination System. Used for cross-hazard event discovery, alert levels and impact context.',links:[['GDACS source profile','/source-detail?source=GDACS']]},usgs:{title:'USGS resource',scope:'Earthquakes',body:'USGS Earthquake Hazards Program. Used for observed earthquake magnitude, depth, place and source timestamps.',links:[['USGS source profile','/source-detail?source=USGS']]},eonet:{title:'NASA EONET resource',scope:'Earth observation',body:'NASA Earth Observatory Natural Event Tracker. Used for open natural-event monitoring and source links.',links:[['NASA EONET profile','/source-detail?source=NASA%20EONET']]},wmo:{title:'WMO resource',scope:'Meteorological context',body:'World Meteorological Organization reference for meteorological and climate context.',links:[['WMO source profile','/source-detail?source=WMO']]}} ,about:{mission:{title:'Mission',scope:'Product',body:'Build a transparent global natural-disaster intelligence interface that separates observed evidence, official warnings, forecasts, history and post-event verification.',links:[['About','/about']]},coverage:{title:'Coverage model',scope:'Global',body:'Coverage spans available connected authoritative sources worldwide. “No record” means no matching connected-source record, not zero risk.',links:[['Regions','/regions'],['Calamities','/calamities']]},limitations:{title:'Limitations',scope:'Safety',body:'The platform cannot guarantee complete zero-latency reporting for every hazard everywhere and does not replace official local emergency instructions.',links:[['Methodology','/methodology']]}}};const group=catalog[kind]||{};const key=Object.keys(group).find(k=>k===id.toLowerCase())||Object.keys(group)[0];const d=group[key]||{title:id,scope:'App detail',body:'This item has a dedicated detail route. Additional live context appears through linked event, region, hazard, source or forecast pages.',links:[['Home','/'],['Live events','/events']]};eyebrow.textContent=kind.toUpperCase()+' DETAIL';title.textContent=d.title;subtitle.textContent=d.scope;kType.textContent=kind;kStatus.textContent='Available';kScope.textContent=d.scope;kUpdated.textContent='Current';mainHead.textContent=d.title;main.innerHTML=`<h3>Overview</h3><p>${PND.esc(d.body)}</p><h3>What this means</h3><p>This page exists as the independent drill-down for this specific ${PND.esc(kind)} item. It does not collapse back into a generic listing page.</p>`;const ENTITY_KEYS=['curated','name'];const drawLinks=()=>{const key=PND.sortValue('sortBy',ENTITY_KEYS);const links=(d.links||[]).slice();if(key==='name')links.sort((a,b)=>String(a[0]).localeCompare(String(b[0])));related.innerHTML=links.map(([n,u])=>`<a class="item" href="${u}"><b>${PND.esc(n)}</b><div class="muted">Open connected detail →</div></a>`).join('')};PND.SORT_DEFS.curated={label:'Suggested order',cmp:()=>0};drawLinks();PND.initSort('sortBy',ENTITY_KEYS,drawLinks);actions.innerHTML=`<a class="action" href="/">Home</a><a class="action" href="/calamities">Calamities</a><a class="action" href="/live-map">Live Map</a><a class="action" href="/resources">Sources</a>`;notes.innerHTML=`<p><b>Entity type:</b> ${PND.esc(kind)}</p><p><b>Entity ID:</b> ${PND.esc(id)}</p><p class="muted">Where live source data is relevant, follow the linked event/source/region pages for timestamped evidence.</p>`;</script><script src="/glossary.js"></script></body></html>
