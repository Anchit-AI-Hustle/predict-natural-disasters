name: Android

# The native Android app in android/. It runs only when the app or this
# workflow changes, so website-only changes spend no minutes here. Branches
# are tested through their pull request; main is tested on every push to it.
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

# A newer push to the same pull request makes the older run moot.
concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build the debug app
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Unit, parity and UI tests (Robolectric)
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Screenshots match the recorded ones
        run: ./gradlew --no-daemon :app:verifyRoborazziDebug
      - name: Lint
        run: ./gradlew --no-daemon :app:lintDebug
      - name: Upload the debug APK
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: predict-natural-disasters-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
      - name: Upload screenshot diffs and test reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: android-test-reports
          path: |
            android/app/build/outputs/roborazzi/
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
