name: Forecast models

# Builds the 30-year climatology the forecast models judge each place
# against, scores the method on forecasts that were really issued 3 and 5
# days ahead, and does a trial run of the coming week (the models job, on
# pull requests and by hand). Once a day, and by hand, the publish job runs
# the models for real: their forecasts go on the site, into the append-only
# ledger data/model-ledger.json, and are graded in data/model-verdicts.json
# once NASA POWER has measured their days.
#
# Runs on any pull request that changes the models, and by hand.
#
# A pull-request run keeps its results as an artifact and in the job summary,
# and commits nothing. It used to commit them back to the PR branch, and
# GitHub holds pull_request runs set off by a GITHUB_TOKEN push for a
# maintainer's approval: CI #323 and #325 and this workflow's #2 and #4 sat
# in action_required for 43 to 58 minutes and were closed as failed when the
# PR merged, without running a job. Only a run started by hand on main
# commits; a push to main by the GITHUB_TOKEN starts no workflow at all.
on:
  workflow_dispatch:
  # The daily run that publishes: the coming week's forecasts, the ledger
  # they are added to, and the grading of every one whose days have now been
  # measured. 04:41 UTC, off the top of the hour, when GitHub drops most
  # queued scheduled jobs, and after NASA POWER's overnight update.
  schedule:
    - cron: '41 4 * * *'
  pull_request:
    paths:
      - 'forecast-models.js'
      - 'tools/build-climatology.js'
      - 'tools/run-models.js'
      - 'tools/model-grades.js'
      - 'tools/backtest-models.js'
      - '.github/workflows/forecast-models.yml'

permissions:
  contents: write

concurrency:
  group: forecast-models-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  models:
    # The climatology and the backtest: on pull requests and by hand. The
    # daily schedule only publishes, below.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Build the climatology (NASA POWER, 1996-2025)
        run: node tools/build-climatology.js data/climatology.json

      - name: Backtest on forecasts issued 3 and 5 days ahead
        run: node tools/backtest-models.js data/climatology.json data/model-backtest.json

      - name: Trial run of the coming week (not published)
        run: |
          cp data/model-ledger.json /tmp/model-ledger.json
          cp data/model-verdicts.json /tmp/model-verdicts.json 2>/dev/null || true
          cp data/model-runs.json /tmp/model-runs.json
          cp data/model-measured.json /tmp/model-measured.json
          node tools/run-models.js data/climatology.json /tmp/model-outlooks.json /tmp/model-runs.json /tmp/model-ledger.json /tmp/model-verdicts.json /tmp/model-measured.json

      - name: Write the scores to the job summary
        run: |
          node -e '
            const b = require("./data/model-backtest.json");
            const o = require("/tmp/model-outlooks.json");
            const rows = Object.entries(b.results).map(([k, r]) =>
              `| ${k} | ${r.days} | ${r.observedRate} | ${r.forecastRate} | ${r.pod} | ${r.far} | ${r.frequencyBias} | ${r.csi} |`);
            const byHazard = {};
            o.outlooks.forEach(x => { byHazard[x.model.hazard] = (byHazard[x.model.hazard] || 0) + 1; });
            console.log([
              "## Backtest (" + b.places + " places, " + b.window.from + " to " + b.window.to + ")",
              "", "| hazard@lead | days | observed | forecast | POD | FAR | bias | CSI |", "|---|---|---|---|---|---|---|---|",
              ...rows, "", b.fireNote, "",
              "## Trial run", "", o.checked + " of " + o.places + " places checked, " + o.outlooks.length + " forecasts: " + JSON.stringify(byHazard),
              ...o.skipped.slice(0, 20).map(s => "- skipped " + s.id + ": " + s.why)
            ].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the climatology and the scores with the run
        uses: actions/upload-artifact@v6
        with:
          name: forecast-models
          path: |
            data/climatology.json
            data/model-backtest.json
          retention-days: 30

      - name: Commit the climatology and the scores
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git add data/climatology.json data/model-backtest.json
          if git diff --cached --quiet; then echo "unchanged"; exit 0; fi
          git config user.name "forecast-models"
          git config user.email "noreply@anthropic.com"
          git commit -m "Climatology and backtest scores for the forecast models"
          # Rebases onto anything merged while this ran, instead of failing on it.
          bash tools/push-with-retry.sh "${GITHUB_REF_NAME}"

  publish:
    # Publishes only from main, on the schedule or by hand. Never from a
    # pull request: a GITHUB_TOKEN push to a PR branch holds its runs for
    # approval (see the top of this file). Started by hand, it waits for the
    # models job and checks out main again, so it runs on the climatology
    # that job has just committed. On the schedule the models job is skipped.
    needs: models
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && needs.models.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Run the models, add to the ledger, grade what has been measured
        run: node tools/run-models.js

      - name: Write the track record summary from both ledgers
        run: node tools/build-accuracy-summary.js

      - name: Commit the forecasts, the ledger and the grades
        run: |
          set -euo pipefail
          git add data/model-outlooks.json data/model-runs.json data/model-ledger.json data/model-verdicts.json data/model-measured.json data/accuracy-summary.json data/forecast-verdicts.json
          if git diff --cached --quiet; then echo "unchanged"; exit 0; fi
          git config user.name "forecast-models"
          git config user.email "noreply@anthropic.com"
          git commit -m "Model forecasts, ledger and grades ($(date -u +%Y-%m-%dT%H:%MZ))"
          # Rebases onto anything merged while this ran, instead of failing on it.
          bash tools/push-with-retry.sh "${GITHUB_REF_NAME}"
