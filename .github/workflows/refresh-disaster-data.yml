name: Refresh disaster intelligence

# Hourly: re-pull the live feed, record any newly-seen outlook and any movement
# in the existing ones, and pre-warm the per-event enrichment cache.
#
# This asked for every five minutes and never got it: a schedule that
# aggressive on a free runner is throttled hard. Asking hourly is both
# achievable and honest.
#
# What it actually achieves is measured rather than asserted here, because a
# hand measurement goes stale: tools/record-changes.js records the gap between
# runs and publishes it as observedCadenceHours, and /api/events serves it as
# meta.refreshRecorded. Read from that record rather than from this comment —
# as of the last run it was a median of about four hours, a shortest of 1.5
# and a longest of nearly 35, which is a scheduled job on a shared runner
# rather than a promise.
#
# The pages themselves are not stale in between: /api/events recomputes the
# feed from the upstream sources on every request. What this job adds is the
# written record — which outlook existed when, and what changed since.
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: disaster-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the live feed for the ledger
        env:
          BASE_URL: https://predict-natural-disasters.anchit-tandon.com
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 2 --retry-delay 3 --max-time 60 \
            "$BASE_URL/api/events?cron=$(date +%s)" -o /tmp/events.json

      # A forecast recomputed on every request cannot be graded. The ledger is
      # append-only and lives in git, so what was forecast and when is auditable
      # and tamper-evident. Recorded before the much longer warm step, which
      # times out often enough that the ledger cannot depend on it.
      - name: Record newly-seen outlooks in the forecast ledger
        run: node tools/record-outlooks.js /tmp/events.json data/outlook-ledger.json

      # What moved since the last run, which the append-only ledger cannot
      # answer: a re-issued outlook is appended as a new row indistinguishable
      # from a new one, and an outlook that stopped being issued leaves no
      # trace at all.
      - name: Record what changed in the forecast set
        run: node tools/record-changes.js /tmp/events.json data/forecast-changes.json

      # Which providers were actually evaluated this run, and how completely.
      # Without it, "nothing forecast this disaster" cannot be told apart from
      # "nothing ever looked there", and the accuracy page has to guess which
      # of the two it is reporting.
      - name: Record what was scanned in the coverage ledger
        run: node tools/record-scan.js /tmp/events.json data/scan-ledger.json

      # One physical disaster, however many providers reported it. Recall needs
      # a denominator of real-world events, and the feed only has provider
      # records: the same flood arrives as a GDACS alert and a ReliefWeb
      # country declaration, and three records is not three disasters.
      - name: Record significant observed disasters
        run: node tools/record-observed.js /tmp/events.json data/observed-disasters.json

      - name: Commit the ledger when it changed
        run: |
          set -euo pipefail
          if git diff --quiet -- data/outlook-ledger.json data/forecast-changes.json data/scan-ledger.json data/observed-disasters.json; then
            echo "ledger unchanged"
            exit 0
          fi
          total=$(node -e "console.log(require('./data/outlook-ledger.json').length)")
          scans=$(node -e "console.log((require('./data/scan-ledger.json').scans||[]).length)")
          obs=$(node -e "console.log((require('./data/observed-disasters.json').events||[]).length)")
          git config user.name "disaster-refresh"
          git config user.email "noreply@anthropic.com"
          git add data/outlook-ledger.json data/forecast-changes.json data/scan-ledger.json data/observed-disasters.json
          # Every run deploys, including the quiet ones.
          #
          # These used to be tagged "[ledger]" so vercel.json's ignoreCommand
          # would skip them and save deployments. But /api/events reads
          # data/forecast-changes.json out of the deployed bundle, so a run
          # that is not deployed is a run production cannot see: after a few
          # quiet hours the page went on presenting the last movement as the
          # latest check, with its timestamp, cadence and active count all
          # stale, and no way for the page to know. A check nobody can see is
          # worth less than a deployment.
          #
          # That marker was introduced when this ran every five minutes, which
          # would have been 288 deployments a day against a limit of 100. At
          # hourly it is at most 24, so the saving it existed for is gone.
          git commit -m "Record outlooks, coverage and observed disasters ($total outlooks, $scans scans, $obs disasters)"
          git push

      - name: Refresh live feed and warm every event's enrichment record
        env:
          BASE_URL: https://predict-natural-disasters.anchit-tandon.com
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 2 --retry-delay 3 --max-time 60 \
            "$BASE_URL/api/events?cron=$(date +%s)" -o /tmp/events.json
          python3 - <<'PY'
          import json, os, sys, urllib.parse, urllib.request, concurrent.futures

          base = os.environ['BASE_URL']
          with open('/tmp/events.json') as fh:
              data = json.load(fh)

          events = data.get('events', [])
          meta = data.get('meta', {})
          sources = meta.get('sources', {})

          # Shape checks: a 200 that returns a broken document is still a failure.
          if not isinstance(events, list) or not events:
              sys.exit('FAIL: /api/events returned no events')
          required = ('id', 'title', 'type', 'source', 'lat', 'lon', 'updated')
          bad = [e.get('id', '?') for e in events if any(e.get(k) in (None, '') for k in required)]
          if bad:
              sys.exit('FAIL: %d events are missing required fields: %s' % (len(bad), bad[:5]))

          online = sorted(k for k, v in sources.items() if v.get('ok'))
          offline = sorted(k for k, v in sources.items() if not v.get('ok'))
          forecasts = [e for e in events if e.get('forecast')]
          print('feed: %d events · %d forecasts · sources online: %s'
                % (len(events), len(forecasts), ', '.join(online) or 'none'))
          if offline:
              print('::warning::upstream sources offline: %s' % ', '.join(offline))
          if not online:
              sys.exit('FAIL: every upstream source is offline')
          if len(forecasts) < 2:
              print('::warning::only %d forecast record(s) available this cycle' % len(forecasts))

          def jsnum(v):
              # JavaScript's String(Number) drops a trailing ".0"; Python's repr
              # keeps it, and a mismatch warms the wrong cache entry.
              f = float(v)
              return str(int(f)) if f.is_integer() else repr(f)

          def enrichment_url(e):
              # Must match the query the browser sends, or a different cache
              # entry gets warmed and visitors still pay the cold-start cost.
              parts = [
                  ('title', e.get('title', '')),
                  ('country', e.get('country', '')),
                  ('region', e.get('region', '')),
                  ('type', e.get('type', '')),
                  ('updated', e.get('updated', '')),
                  ('forecast', 'true' if e.get('forecast') else 'false'),
              ]
              if isinstance(e.get('lat'), (int, float)) and isinstance(e.get('lon'), (int, float)):
                  parts += [('lat', jsnum(e['lat'])), ('lon', jsnum(e['lon']))]
              return '%s/api/event-enrichment?%s' % (base, urllib.parse.urlencode(parts))

          def warm(e):
              try:
                  req = urllib.request.Request(enrichment_url(e), headers={'user-agent': 'pnd-refresh-cron/1.0'})
                  with urllib.request.urlopen(req, timeout=45) as r:
                      if r.status != 200:
                          raise RuntimeError('HTTP %s' % r.status)
                      r.read(2048)
                  return True
              except Exception as ex:
                  print('::warning::enrichment warm failed for %s: %s' % (e.get('id'), ex))
                  return False

          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
              results = list(pool.map(warm, events))

          warmed = sum(results)
          print('warmed %d/%d event enrichment records' % (warmed, len(events)))
          if warmed == 0:
              sys.exit('FAIL: /api/event-enrichment did not answer for any event')
          if warmed < len(events) * 0.5:
              sys.exit('FAIL: enrichment warmed for only %d of %d events' % (warmed, len(events)))
          PY
